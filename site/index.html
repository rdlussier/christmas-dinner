<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Christmas Dinner</title>
<meta name="theme-color" content="#6A1826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xmas Dinner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=28" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=28">
</head>
<body>
<div class="wrap">
  <header><h1><button class="home" type="button" data-cook="" aria-label="Christmas Dinner, back to all dishes">Christmas Dinner</button></h1></header>
  <nav class="topbar"><div class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="t-menu" data-tab="menu" aria-selected="true" aria-controls="p-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 2 2M11 3v7a2 2 0 0 1-2 2v9M9 3v6M17 21V3c-2 1-3.5 3.5-3.5 7v3H17"/></svg>Menu</button>
    <button class="tab" role="tab" id="t-shopping" data-tab="shopping" aria-selected="false" aria-controls="p-shopping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9L5 8zM9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Shopping</button>
    <button class="tab" role="tab" id="t-timeline" data-tab="timeline" aria-selected="false" aria-controls="p-timeline"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Timeline</button>
  </div>
    <div class="cookbar" id="cookbar" role="toolbar" aria-label="Dishes you are cooking" hidden></div></nav>
  <main id="main">
    <section class="panel" id="p-menu" role="tabpanel" aria-labelledby="t-menu"></section>
    <section class="panel" id="p-shopping" role="tabpanel" aria-labelledby="t-shopping" hidden></section>
    <section class="panel" id="p-timeline" role="tabpanel" aria-labelledby="t-timeline" hidden></section>
  </main>
  <footer>
    <div class="hrow">
      <label><span class="sum">Year </span><select id="year" aria-label="Year"></select></label>
      <button class="sync linkish" type="button" id="sync">This device only · set up sync</button>
    </div>
    <p id="fnote"></p>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>
<dialog id="syncdlg">
  <form method="dialog" class="dlg">
    <h2>Sync ticks</h2>
    <p>Paste a GitHub token so ticks are shared between your phone and laptop. Use a fine-grained token limited to the <code>christmas-dinner</code> repo, with Contents set to read and write. It is stored only in this browser.</p>
    <label for="tok">GitHub token</label>
    <input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    <p class="dlgmsg" id="dlgmsg"></p>
    <div class="dlgbtns">
      <button class="btn" type="button" id="tokoff">Turn off sync</button>
      <button class="btn" value="cancel">Close</button>
      <button class="btn primary" type="button" id="toksave">Save and sync</button>
    </div>
  </form>
</dialog>
<script src="app.js?v=28"></script>
</body>
</html>
